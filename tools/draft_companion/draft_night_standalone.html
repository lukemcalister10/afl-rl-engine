  function idsOf(k) {

  // ---------- v0 (engine tables: tools/draft_companion/extract_v0_tables.py)

  // ---------- dates: shown d/m/yy, stored yyyy-mm-dd

  // ---------- badges and flags

  }

  // ---------- tables

  // ---------- move a player to another pick (the players between shift by one)

  }
  const nameCell = c => c.type === "draft"

        <td style="font-weight:600;font-size:12.5px">${esc(c.pos.map(p => PSHORT[p] || p).join(" / ") || "—")}</td><td class="r">${c.age == null ? "—" : c.age}</td>
        <td class="v0 r">${fmt(c.v)}</td>
        <td><select class="ed" data-t="${c.type}" data-id="${esc(c.id)}" aria-label="AFFL club for ${esc(c.name)}">${clubOpts(D.affl_clubs, "", "Assign to club…")}</select></td></tr>`).join("")
      : `<tr><td colspan="7" class="empty">Nobody left here. Enter draftees on the AFL draft tab, or change the filters.</td></tr>`;
    const taken = all.filter(c => c.affl).sort((a, b) => a.affl.localeCompare(b.affl) || (b.v || 0) - (a.v || 0));
    document.getElementById("taken").innerHTML = taken.length ? taken.map(c => `<tr>
        <td class="nm" style="padding-left:14px">${nameCell(c)}</td><td style="font-weight:600">${esc(c.affl)}</td><td>${esc(c.from)}</td><td class="r">${fmt(c.v)}</td>
        <td class="r"><button class="btn" data-undo="${c.type}" data-id="${esc(c.id)}">Undo</button></td></tr>`).join("")
      : `<tr><td colspan="5" class="empty">Nobody taken yet.</td></tr>`;
  }
  function assign(type, id, club) {
    if (type === "draft") { row(id).affl = club; queueSave("slots", id); syncRow(id); }
    else { S.fa[id] = Object.assign({}, S.fa[id], { affl: club }); queueSave("fa", id); }
    saveLocal(); renderLive();
  }
  document.getElementById("avail").addEventListener("change", ev => { const el = ev.target; if (el.dataset.t && el.value) assign(el.dataset.t, el.dataset.id, el.value); });
  document.getElementById("taken").addEventListener("click", ev => { const b = ev.target.closest("button[data-undo]"); if (b) assign(b.dataset.undo, b.dataset.id, ""); });
  lPos.addEventListener("change", renderLive); lSrc.addEventListener("change", renderLive);

  // ---------- tabs
  const tabs = { entry: document.getElementById("tab-entry"), live: document.getElementById("tab-live") };
  function show(which) {
    for (const k of Object.keys(tabs)) { tabs[k].setAttribute("aria-selected", String(k === which)); document.getElementById("view-" + k).hidden = k !== which; }
    document.querySelectorAll("[data-entry-only]").forEach(b => { b.hidden = which !== "entry"; });
    if (which === "live") renderLive();
    try { localStorage.setItem(LS_KEY + "-tab", which); } catch (e) { /* ignore */ }
  }
  tabs.entry.addEventListener("click", () => show("entry")); tabs.live.addEventListener("click", () => show("live"));

  // ---------- CSV
  function csv() {
    const q = v => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [["record", "slot", "pathway", "player", "dob", "draft_age", "state", "position_1", "position_2", "pos1_pct", "pos2_pct", "v0", "afl_club", "affl_club", "store_key", "category", "category_club"].join(",")];
    for (const id of allIds()) {
      const r = S.slots[id]; if (!r || !r.name) continue;
      const k = kindOf(id), w = weights(r), pct = w ? w.parts.map(([, f]) => Math.round(f * 100)) : [], v = rowV0(id);
      lines.push([k === "nd" ? "national" : k === "rd" ? "rookie" : "pathway", k === "nd" ? numOf(id) : k === "rd" ? "R" + numOf(id) : "P" + numOf(id),
        k === "op" ? PATH_NAME[r.kind || "UNR"] : "", r.name, r.dob || "", draftAge(r.dob) ?? "", r.state || "", r.pos1 || "",
        (r.pos2 && r.pos2 !== r.pos1) ? r.pos2 : "", pct[0] ?? "", pct[1] ?? "", v == null ? "" : Math.round(v), r.afl || "", r.affl || "", "",
        r.cat ? CAT_NAME[r.cat] : "", r.cat ? (CODE_CLUB[r.tie] || r.tie || "") : ""].map(q).join(","));
    }
    for (const f of D.free_agents) {
      const st = S.fa[f.key]; if (!st || !st.affl) continue;
      lines.push(["free_agent", "", "", f.name, "", f.age ?? "", "", f.pos || "", "", "", "", f.v ?? "", f.afl_club || "", st.affl, f.key, "", ""].map(q).join(","));
    }
    return lines.join("\n") + "\n";
  }
  let downloads = null;
  document.getElementById("export").addEventListener("click", async () => {
    const text = csv();
    if (STANDALONE) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = "affl_draft_2026.csv";
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0); return;
    }
    if (downloads) { try { await downloads.save({ filename: "affl_draft_2026.csv", data: text }); return; } catch (e) { if (e && e.code === "declined") return; } }
    showCsv(text, "Downloads aren't available here. Copy this instead.");
  });
  document.getElementById("copy").addEventListener("click", async () => {
    const text = csv();
    try { await navigator.clipboard.writeText(text); const b = document.getElementById("copy"); b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy CSV"; }, 1500); }
    catch (e) { showCsv(text, "Select all and copy."); const t = document.getElementById("csvtext"); t.focus(); t.select(); }
  });
  function showCsv(text, note) { document.getElementById("csvbox").hidden = false; document.getElementById("csvnote").textContent = note; document.getElementById("csvtext").value = text; }

  // ---------- sync with the artifact's database (fallback: this device only)
  const syncEl = document.getElementById("sync"), syncTxt = document.getElementById("synctext");
  const setSync = (state, text) => { syncEl.className = "sync" + (state ? " is-" + state : ""); syncTxt.textContent = text; };
  let db = null, readOnly = false;
  const timers = {}, inflight = {}, again = {};
  function queueSave(coll, id) {
    if (readOnly) return;
    const key = coll + "/" + id; clearTimeout(timers[key]);
    if (STANDALONE) { setSync("ok", "Saved in this browser"); return; }
    if (!db) { setSync("warn", "Saved on this device only"); return; }
    setSync("", "Saving…");
    timers[key] = setTimeout(() => { delete timers[key]; flush(coll, id); }, 700);
  }
  async function flush(coll, id) {
    const key = coll + "/" + id;
    if (inflight[key]) { again[key] = true; return; }
    inflight[key] = true;
    const payload = Object.assign({}, coll === "slots" ? S.slots[id] : S.fa[id]);
    try { await db.collection(coll).doc(id).set(payload); if (!Object.keys(timers).length) setSync("ok", "All changes saved"); }
    catch (e) {
      if (e && e.code === "unavailable") setTimeout(() => flush(coll, id), 800 + Math.random() * 800);
      else if (e && e.code === "invalid_argument") { readOnly = true; setSync("warn", "View only"); }
      else setSync("warn", "Couldn't save online: kept on this device");
    } finally { inflight[key] = false; if (again[key]) { again[key] = false; flush(coll, id); } }
  }
  const busy = (coll, id) => timers[coll + "/" + id] || inflight[coll + "/" + id];
  function applySnapshot(coll, snap) {
    let changed = false, rerender = false;
    for (const d of snap.docs) {
      if (busy(coll, d.id)) continue;
      const data = Object.assign({}, d.data() || {});
      if (coll === "slots") {
        const tr = trOf(d.id);
        if (tr && tr.contains(document.activeElement)) continue;
        S.slots[d.id] = data; changed = true;
        if (tr) syncRow(d.id); else rerender = true;
      } else { S.fa[d.id] = data; changed = true; }
    }
    if (rerender) renderTable("op");
    if (changed) { saveLocal(); counts(); refreshList(); renderLive(); }
  }
  async function connect() {
    if (STANDALONE) { setSync("ok", "Saved in this browser"); return; }
    if (!(window.claude && window.claude.use)) { setSync("warn", "Saved on this device only"); return; }
    try { downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { setSync("warn", "Saved on this device only"); return; }
    try {
      const user = await window.claude.use("user");
      if (user && !(await user.canEdit())) { readOnly = true; setSync("ok", "Viewing live"); }
    } catch (e) { /* not told: keep inputs */ }
    const first = { slots: false, fa: false };
    const timer = setTimeout(() => { if (!first.slots) setSync("warn", "Can't reach saved data yet; working on this device"); }, 10000);
    for (const coll of ["slots", "fa"]) {
      db.collection(coll).onSnapshot(snap => {
        applySnapshot(coll, snap);
        if (!snap.metadata.fromCache) { first[coll] = true; if (first.slots) { clearTimeout(timer); if (!Object.keys(timers).length && !readOnly) setSync("ok", "All changes saved"); } }
      }, () => { clearTimeout(timer); setSync("warn", "Saved on this device only"); });
    }
  }

  // ---------- boot
  renderLookup(); renderAll(); renderLive();
  let startTab = "entry"; try { startTab = localStorage.getItem(LS_KEY + "-tab") || "entry"; } catch (e) { /* ignore */ }
  show(startTab === "live" ? "live" : "entry");
  connect();
})();
</script>
</body></html>
