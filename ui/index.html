<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ValueBoard · Matchday</title>
<!-- MATCHDAY UI — implementation of docs/ui_styles/theme_03_matchday_FINAL/ (LOCK = visual law).
     TIER 3 (never bakes; no value change). Pure view: reads the derived board READ-ONLY, computes no price.
     Dark-only (Q-THEME a). Renders from file:// and when served. -->
<link rel="stylesheet" href="styles/matchday.css">
</head>
<body>
<div id="root"></div>

<!-- generated, stamped, tiered board bundles (read-only; from ui/tools/extract_board_view.py) -->
<script src="data/board_view_working.js"></script>
<script src="data/board_view_public.js"></script>
<!-- club-valuation bundle (picks priced + per-club summary; from ui/tools/ingest_inputs.py, VALIDATE-OR-HALT) -->
<script src="data/club_valuation.js"></script>
<!-- #232 LIVE-lane ownership sidecar (same command as the bundle above; from docs/inputs/AFFL_Player_Locations.csv).
     Overrides the board's stored affl_team; the store remains the fallback. A trade costs an edit, not an
     engine run. Optional: absent = every row falls back to the store, which is the pre-#232 behaviour. -->
<script src="data/ownership.js"></script>
<!-- v1.3 values-free position map (item 196(2); from ui/tools/extract_positions.py — no dollar value) -->
<script src="app/positions_data.js"></script>
<!-- v0 ENTRY-PRICE sidecar (owner-commissioned 2026-08-21; from ui/tools/gen_v0_sidecar.py, a READ-ONLY
     engine load). Deliberately NOT under ui/data/: that directory is landing-carrier territory
     (tools/landing/carriers.py) and this bundle is not a landing carrier. Stamped with the board + store
     it was generated from; MD.v0 REFUSES it when either disagrees with the loaded board. Optional:
     absent = the v0 block simply does not render, and says why. -->
<script src="data_aux/v0.js"></script>
<!-- weekly movers bundle (one report per committed round; from engine/rl_after/ingestion/round_movers.py).
     Optional: absent until a round is applied; the Movers view fail-closes cleanly when it is missing. -->
<script src="data/movers.js"></script>
<!-- owner-approved Movers provenance transition (ITEM 408 Items 6-7, Option A; mirrors data/release_lineage.json
     `release_transition`). Bridges the historical R15-R19 reports to the current accepted release, fail-closed. -->
<script src="data/movers_transition.js"></script>

<!-- app -->
<script src="app/config.js"></script>
<script src="app/format.js"></script>
<script src="app/counting.js"></script>
<script src="app/seam.js"></script>
<script src="app/ownership.js"></script>
<script src="app/v0.js"></script>
<script src="app/club_totals.js"></script>
<script src="app/history.js"></script>
<script src="app/pocket.js"></script>
<script src="app/board.js"></script>
<script src="app/universe.js"></script>
<script src="app/configview.js"></script>
<script src="app/clubs.js"></script>
<script src="app/card.js"></script>
<script src="app/trade.js"></script>
<script src="app/movers.js"></script>
<script src="app/main.js"></script>
</body>
</html>
