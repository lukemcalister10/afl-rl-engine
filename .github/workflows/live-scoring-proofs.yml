name: Live Scoring Proofs (manual)

# THE SIX FULL WEEKLY-UPDATE REHEARSALS, off every-push (#251 part B, owner ruling 2026-07-29 —
# "agree on the proof jobs"). They used to run on every push and pull_request from live-scoring.yml, six
# jobs at a 180-minute timeout each, and all six died in ~30 seconds at the v0surf frozen-signature HALT:
# they structurally cannot pass as wired. Six permanently-red every-push jobs are noise that hides real
# reds, so they are DE-SCOPED, not deleted, and not otherwise changed.
#
# WHAT THEY ARE, and why they are kept. Each is a complete weekly-update rehearsal in a scratch workspace
# — two-round sequential apply, five-round catch-up, mid-run crash injection, post-commit finalization
# injection, store writes, FV provenance. They were built as one-off proofs for the weekly-updater work.
# Their future use is a deliberate one-shot rehearsal when the positional rebuild changes the engine, which
# is exactly what a manual trigger is for.
#
# WHAT IS NOT IN SCOPE HERE. Making them PASS. The v0surf third-signature question (65b9fbaf, cause
# undetermined) is deliberately unresolved and the freeze is not weakened — dispatching one of these today
# will still HALT on the frozen signature. That is the design working, and it is a separate decision.
#
# The push/PR signal for this workstream stays in live-scoring.yml, which keeps `live-scoring-light`.
# The job bodies below are byte-identical to the ones removed from live-scoring.yml; the only additions
# are the per-job `if:` selectors.

on:
  workflow_dispatch:
    inputs:
      proof:
        description: 'Which rehearsal to run (each proof job is startable on its own)'
        type: choice
        required: true
        default: two-round
        options:
          - two-round
          - catchup
          - failure-injection
          - finalization-injection
          - storewrite
          - fv-provenance
          - all

concurrency:
  # A hand-started rehearsal is deliberate: never cancel one because another was started.
  group: live-scoring-proofs-${{ github.ref }}-${{ inputs.proof }}
  cancel-in-progress: false

jobs:
  proof-two-round:
    # startable on its own: pick 'two-round', or 'all' to run the whole rehearsal set.
    if: ${{ inputs.proof == 'all' || inputs.proof == 'two-round' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RL_REPO: ${{ github.workspace }}
      CLAUDE_PROJECT_DIR: ${{ github.workspace }}
      PYTHONHASHSEED: "0"
      # single-env board recipe (matches the board-of-record build)
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The disposable R14 fixture reconstructs its baseline from EXACT historical git bytes at the
          # R14 authority anchor (93bd01af); full history is required or materialize_r14 fails closed.
          fetch-depth: 0

      - name: Pin Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Ensure python3.12 on PATH (setup_env.sh discovers it by name)
        run: |
          set -euo pipefail
          if ! command -v python3.12 >/dev/null 2>&1; then
            PYBIN="$(dirname "$(command -v python)")"
            ln -s "$PYBIN/python" "$PYBIN/python3.12"
          fi
          python3.12 --version

      - name: Create engine absolute-path root (/home/claude/...)
        run: sudo mkdir -p /home/claude && sudo chown -R "$USER":"$USER" /home/claude

      - name: Provision pinned env (setup_env.sh)
        run: |
          set -euo pipefail
          bash setup_env.sh
          echo "$HOME/rl_venv312/bin" >> "$GITHUB_PATH"

      - name: Seed vendored unidecode (offline import dep)
        run: |
          set -euo pipefail
          mkdir -p /home/claude/rl_vendor
          cp -rf vendor/unidecode /home/claude/rl_vendor/unidecode

      - name: Seed engine absolute-path artifacts (frozen pkls + import-time board panel)
        # The engine loads a few frozen artifacts by ABSOLUTE /home/claude/... path, and compute.py
        # reads /home/claude/rl_build/rl_app_data.json at IMPORT time (a diagnostic "before" panel whose
        # CONTENT does not affect the board — but the file must EXIST or the board build's import fails).
        # This is the same seeding session_2026-07-20/fv_provenance_remediation/test_fv_provenance.py does
        # on a clean runner (mirrors bootstrap.sh) — WITHOUT running the legacy bootstrap Guard 5, which
        # the accepted foundation's stale engine pins would red (register item 399).
        run: |
          set -euo pipefail
          for f in cm_400.pkl q97m.pkl v0surf.pkl; do
            [ -f "data/$f" ] && cp -f "data/$f" "/home/claude/$f" || true
          done
          mkdir -p /home/claude/rl_build
          cp -f data/rl_build/rl_app_data.json /home/claude/rl_build/rl_app_data.json
          echo "seeded /home/claude: $(ls /home/claude) | rl_build: $(ls /home/claude/rl_build)"

      - name: Assert the store-write gate ships OFF (belt-and-braces, both halves)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0, 'engine/rl_after/ingestion')
          import score_ingestor as SI
          assert SI.APPLY_DEFAULT is False, "APPLY_DEFAULT must ship False"
          assert not os.environ.get('INGEST_SCORE_APPLY'), "INGEST_SCORE_APPLY must be unset"
          assert not os.environ.get('INGEST_SCORE_APPLY_ARMED'), "INGEST_SCORE_APPLY_ARMED must be unset"
          assert SI._apply_enabled() is False, "the shipped gate must be OFF"
          print("GATE OFF (shipped): APPLY_DEFAULT=%s, env unset, _apply_enabled=%s"
                % (SI.APPLY_DEFAULT, SI._apply_enabled()))
          PY

      - name: Sequential two-round proof (R15 -> R16, history integrity, restart, UI, no-prod-touch)
        run: |
          set -euo pipefail
          python3 session_2026-07-20/live_scoring_two_round/two_round_proof.py --write

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-scoring-proofs-two-round
          path: |
            session_2026-07-20/live_scoring_two_round/proof.json
            session_2026-07-20/live_scoring_two_round/PROOF.md
          if-no-files-found: ignore

