name: Final Integration

# THE FAST PROOFS THAT ONLY THIS WORKFLOW RUNS (CI Phase 0.1, 2026-10-13).
#
# This workflow was red on every push from 2026-08-20 to 2026-10-13: its first real step ran a
# hand-curated config inventory that did not know ~87 RL_* reads added since August, and nothing
# below it ever ran. The 0.1 act deleted what caught nothing and kept what was shown to pass on a
# checkout of this tree. What is left here is every fast check that is NOT already run by the
# host-insensitive composite (manifests, contract, rulebook lint, the acceptance runner) or by
# fv-provenance.yml (the pinned-env board rebuild + provenance red/green suite):
#
#   season-state      derivation / wiring / behaviour / stale rejection (season_progress_test),
#                     fenced reads halt (season_state_fenced_test), the fixed R14 + current-round
#                     anchors (season_anchor_check)
#   board invariants  invariant_proof.py per-push lane (structural; released-baseline equality is
#                     the adoption lane and gates at adoption, not here)
#   UI                the extract / release / counting / club-curve / ownership / movers seams, and
#                     the two Chromium suites (responsive layout, #222 item acceptance)
#   bundles           a fresh extract reproduces both committed UI bundles byte-exact — measured in a
#                     scratch dir (tools/probe_bundle_equality.py), never by rewriting ui/data
#   Track B           the weekly-updater and catch-up preflight fast unit tests
#
# REMOVED 2026-10-13, and why (each verified before removal):
#   config_inventory.py + release_state_failclosed_test.py   hand-curated RL_* classification, stale
#                                                            since August; RESULT: FAIL on every push
#   season_anchor_check_nonvacuity.py                        9/11 against the live tree
#   acceptance_matrix.py                                     a July prose matrix that re-ran the two
#                                                            deleted tests and wrote its verdict JSON
#                                                            into the tracked tree
#   asset_view_ui_check.mjs                                  asserts pick rows + a reconciliation panel
#                                                            the UI de-bloat (225f9ac3, owner critique
#                                                            2026-08-28) removed; 804 rows / 0 picks
#   build_final_board.py + bootstrap.sh                      the ~25-minute clean-room board build;
#                                                            fv-provenance.yml is the byte-identical
#                                                            rebuild surface, and this one could not be
#                                                            shown to pass on a bare runner
#   the Board B fetch step                                   actions/checkout with fetch-depth 0 fetches
#                                                            every branch, and 70ef0ff is the tip of
#                                                            origin/codex/establish-forward-lens-acceptance;
#                                                            invariant_proof.py still reads that blob,
#                                                            so that branch must not be deleted
#   the two "retired but kept" proofs                        r15_ladder_survival_proof.py and
#                                                            season_advance_r14_r19_proof.py are deleted
#                                                            from the tree (unwired since #274, could not
#                                                            run)
#
# A GATE MUST NOT WRITE INTO THE TREE IT GATES. Every step below writes only to a scratch dir, and the
# last step proves it: `git status --porcelain` must be empty when the job ends.

on:
  push:
  pull_request:

concurrency:
  group: final-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------------------------------
  # PLAN_v6 1a — THE HOST-INSENSITIVE FLOOR, on every push. Its own job, deliberately: it must give a
  # verdict whether or not this workflow's other job can run at all, on any runner, with no shared
  # workspace and no board build.
  host-insensitive-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/host-insensitive-gates

  final-integration:
    runs-on: ubuntu-24.04
    # No board build any more: env provisioning + Chromium + a few minutes of fast checks.
    timeout-minutes: 30
    env:
      RL_REPO: ${{ github.workspace }}
      CLAUDE_PROJECT_DIR: ${{ github.workspace }}
      RL_FV: ${{ github.workspace }}/engine/forward_valuation
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # History reads need real depth: season_anchor_check.py does `git show 93bd01af:…` (the R14
          # anchor store) and invariant_proof.py does `git show 70ef0ff:…` (Board B, the DEFERRED
          # forward diagnostic). fetch-depth 0 fetches every branch and tag, which is what makes the
          # non-ancestor 70ef0ff resolvable without a fetch step of its own.
          fetch-depth: 0

      - name: Pin Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Ensure python3.12 on PATH
        run: |
          set -euo pipefail
          if ! command -v python3.12 >/dev/null 2>&1; then
            PYBIN="$(dirname "$(command -v python)")"; ln -s "$PYBIN/python" "$PYBIN/python3.12"
          fi
          python3.12 --version

      - name: Engine absolute-path root (/home/claude/...)
        run: sudo mkdir -p /home/claude && sudo chown -R "$USER":"$USER" /home/claude

      - name: Provision pinned env (setup_env.sh)
        run: |
          set -euo pipefail
          bash setup_env.sh
          echo "$HOME/rl_venv312/bin" >> "$GITHUB_PATH"

      - name: Seed engine absolute-path artifacts (vendored unidecode, frozen pkls, import-time board panel)
        # The engine loads a few frozen artifacts by ABSOLUTE /home/claude/... path and reads
        # /home/claude/rl_build/rl_app_data.json at IMPORT time (a diagnostic panel whose content does
        # not affect anything, but the file must exist). Same seeding the deleted live-scoring job
        # used for exactly these fast tests — read-only, no bootstrap, no Guard 5.
        run: |
          set -euo pipefail
          mkdir -p /home/claude/rl_vendor /home/claude/rl_build
          cp -rf vendor/unidecode /home/claude/rl_vendor/unidecode
          for f in cm_400.pkl q97m.pkl v0surf.pkl; do
            [ -f "data/$f" ] && cp -f "data/$f" "/home/claude/$f" || true
          done
          cp -f data/rl_build/rl_app_data.json /home/claude/rl_build/rl_app_data.json
          echo "seeded /home/claude: $(ls /home/claude)"

      - name: Node + Playwright (Chromium) for the UI checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install playwright-core + Chromium
        run: |
          set -euo pipefail
          # OUTSIDE THE TREE: the last step of this job proves the gates wrote nothing into the checkout,
          # and an in-tree node_modules/ failed it on every push from 2026-10-13 (a9a8f283) on.
          TOOLS="$RUNNER_TEMP/node-tools"; mkdir -p "$TOOLS"
          npm i --prefix "$TOOLS" --no-save playwright-core@1.47.2
          # Pin the INSTALLER to the same version so it fetches the exact chromium revision
          # playwright-core@1.47.2 expects (an unpinned `npx playwright install` fetches a different
          # revision, leaving chromium.executablePath() pointing at a path that does not exist).
          npx --yes playwright@1.47.2 install chromium
          echo "PLAYWRIGHT_CORE=$TOOLS/node_modules/playwright-core" >> "$GITHUB_ENV"
          CHROME="$(cd "$TOOLS" && node -e "const {chromium}=require('playwright-core');console.log(chromium.executablePath())")"
          if [ ! -x "$CHROME" ]; then CHROME="$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux/chrome 2>/dev/null | head -1)"; fi
          test -x "$CHROME" || { echo "no chromium installed for the UI checks"; exit 1; }
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          echo "Chromium for UI checks: $CHROME"

      - name: Season-state — derivation, wiring, behaviour, stale rejection + FENCED reads halt
        run: |
          set -euo pipefail
          python3 session_2026-07-21/final_integration/tests/season_progress_test.py
          python3 session_2026-07-21/final_integration/tests/season_state_fenced_test.py

      # #256 part A. PER-PUSH lane only: structural invariants of whatever board the tree carries. The
      # released-baseline EQUALITY checks are RELEASE CONDITIONS and gate at adoption with
      #     python3 session_2026-07-21/final_integration/tools/invariant_proof.py --adoption
      - name: Present / forward invariants + F5 reconciliation — PER-PUSH lane
        run: python3 session_2026-07-21/final_integration/tools/invariant_proof.py

      - name: UI seams (extract / release / counting / club-curve / ownership / movers)
        run: |
          set -euo pipefail
          python3 ui/tests/extract_seam.test.py
          node    ui/tests/release_seam.test.js
          node    ui/tests/counting_rule.test.js
          python3 ui/tests/club_curve_provenance.test.py
          python3 ui/tests/test_club_valuation_current.py
          node    ui/tests/club_totals_parity.test.js
          node    ui/tests/ownership_single_source.test.js
          python3 ui/tests/ownership_store_apply.test.py
          node    ui/tests/movers.test.js

      - name: UI — responsive layout (Chromium, all widths)
        run: node ui/tests/responsive_layout.test.mjs

      # #139 items 3/5/9/11/12/13/14/15/16/17/18/21 (issue #222). Guards the two things that would fail
      # SILENTLY: the card claiming a player missed a game the feed never covered, and the browser-side
      # club totals drifting from the ingest's own arithmetic. Both read live data — no hand-pinned hashes.
      - name: UI — #222 item acceptance (Chromium)
        run: node ui/tests/ui_222_items.test.mjs

      - name: Season-state anchors (fixed R14 historical + current round) + generated-bundle equality
        run: |
          set -euo pipefail
          # #251 part C: ONE executable definition of the season-state assertion; the fixed R14 anchor
          # (0.58/0.545 from the immutable store 968de0c7 @ 93bd01af) plus the current-round anchor
          # re-derived from the manifest and the committed stamp — nothing hand-typed to go stale.
          python3 session_2026-07-21/final_integration/tests/season_anchor_check.py
          # A fresh extract must reproduce both committed UI bundles byte-for-byte. Measured in a
          # scratch dir — this step used to regenerate ui/data IN PLACE and cmp, i.e. rewrite the
          # tree it was gating.
          python3 tools/probe_bundle_equality.py

      - name: Track B fast unit tests (weekly updater + catch-up preflight)
        run: |
          set -euo pipefail
          python3 engine/rl_after/ingestion/test_weekly_updater.py
          python3 engine/rl_after/ingestion/test_catchup_preflight.py

      - name: The gates wrote nothing into the tree they gated
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "a gate wrote into the tracked tree:"; git status --porcelain; exit 1
          fi
          echo "tree clean after every gate"
